<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/images/favicon.png" type="image/x-icon">

    <title>BMI Calculator</title>
</head>
<body>
    <main class="container-fluid">
        <div class="page-heading">
            <p class="eyebrow">A SIMPLE HEALTH CHECK</p>
            <h1>Body Mass Index</h1>
            <p class="subtitle">Enter your details to calculate your BMI.</p>
        </div>

        <div class="box">
            <label for="name" class="form-label">Name <span class="required">*</span></label>
            <input type="text" id="name" class="form-control" placeholder="Your name">

            <label for="height" class="form-label">Height <span class="unit">(cm)</span> <span class="required">*</span></label>
            <input type="number" id="height" class="form-control" placeholder="For example, 170">

            <label for="weight" class="form-label">Weight <span class="unit">(kg)</span> <span class="required">*</span></label>
            <input type="number" id="weight" class="form-control" placeholder="For example, 65">

            <button class="btn text-white fw-bold" onclick="calculateBMI()">Calculate my BMI</button>
        </div>

        <div class="output">
            <p id="bmi"></p>
            <p id="bmiOutput"></p>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
