<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/images/favicon.png" type="images/x-icon">
    <title>BMI Calculator</title>
</head>
<body>
    <div class="container-fluid">
        <h5 class="text-center fw-bold text-white">Body Mass Index (BMI) Calculator</h5>
        <div class="box px-4 py-3 align-items-center mt-3">
            <label for="name" class="form-label mt-2">Name <span style="color: red;">*</span></label>
            <input type="text" id="name" class="form-control">
            <label for="height" class="form-label mt-4">Height <span class="fw-light fs-6">(cm) </span><span
                    style="color: red;">*</span></label>
            <input type="number" id="height" class="form-control">
            <label for="height" class="form-label mt-4">Weight <span class="fw-light fs-6">(kg)</span><span
                    style="color: red;">*</span></label>
            <input type="number" id="weight" class="form-control">
            <button class="btn text-white fw-bold px-4 py-2 mt-4 border border-0 d-block mx-auto"
                onclick="calculateBMI()">Calculate</button>
        </div>
        <div class="output">
            <p id="bmi" class="text-center mt-3 fw-bold"></p>
            <p id="bmiOutput" class="text-center fw-bold m-0 text-white"></p>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
